name: Node tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm run pack:check

      - name: Smoke test packaged CLI
        run: npm run pack:smoke

      - name: Validate public evidence output
        run: |
          node src/cli.js public-evidence --out public-evidence.json --markdown public-evidence.md
          node -e 'const fs=require("node:fs"); const evidence=JSON.parse(fs.readFileSync("public-evidence.json", "utf8")); if (evidence.status !== "ready") throw new Error("public evidence is not ready"); if (!evidence.publicLinks.npmPackage) throw new Error("npm link missing"); console.log(`proofPoints=${evidence.proofPoints.length}`);'

      - name: Check final form copy
        run: |
          npm run final-copy:check
          npm run submission:versions
          npm run application:status
          npm run reviewer:quickstart
          npm run form-draft:sample
          npm run publish:samples
          npm run publish:docs
          npm run dashboard:readiness
          npm run contrib:readiness
          npm run public:redaction
          npm run evidence:sample

      - name: Check public evidence links
        if: matrix.node-version == 22
        run: |
          npm run evidence:links
          npm run readme:badges
          npm run readme:readiness
